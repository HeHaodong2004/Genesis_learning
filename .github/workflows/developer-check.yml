name: Developer workbench

on:
  push:
    paths:
      - 'developer/**'
      - 'src/gnav/config.py'
      - 'src/gnav/__init__.py'
      - 'configs/**'
      - '.vscode/**'
      - 'Makefile'
      - '.github/workflows/developer-check.yml'
  pull_request:
    paths:
      - 'developer/**'
      - 'src/gnav/config.py'
      - 'src/gnav/__init__.py'
      - 'configs/**'
      - '.vscode/**'
      - 'Makefile'
      - '.github/workflows/developer-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lightweight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: developer/requirements-ci.txt
      - run: python -m pip install -r developer/requirements-ci.txt
      - run: python developer/check.py
